<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoRA 文件 · 镜场</title><script src="/theme-bootstrap.js"></script><link rel="stylesheet" href="/cloud-workflows.css"><link rel="stylesheet" href="/loras.css"><link rel="stylesheet" href="/jade-motion.css"><link rel="stylesheet" href="/cyan-glass.css"></head><body data-native-page="loras">
<header><a id="back" href="/">← 回云工作流</a><strong>LoRA 文件</strong><span id="project-name"></span></header>
<main inert><section><h1>把自己的 LoRA 用进工作流</h1><p>导入本机文件，确认后上传到 RunningHub，再选入工作流的 RHLoraLoader 节点。</p>
<h2>1 · 导入并校验</h2><label>本机文件<input id="file" type="file" accept=".safetensors"></label><p class="hint">支持 safetensors，单文件最多 2 GiB，文件头最多 16 MiB。这里只检查文件结构和完整性，不保证模型架构或生成效果兼容。导入只保存在本机。</p><button id="import">导入本机文件</button><p id="import-state" role="status"></p>
<label>文件库<select id="files" aria-label="选择 LoRA 文件"></select></label><div id="file-info"></div><button id="attach">加入当前项目</button><button id="refresh">刷新文件与记录</button>
<h2>2 · 准备上传</h2><div class="grid"><label>平台根地址<input id="base" type="url" value="https://www.runninghub.cn"></label><label>平台 LoRA 名称<input id="lora-name" maxlength="120"></label></div><label>本次 API Key<input id="key" type="password" autocomplete="new-password" placeholder="仅用于本次取得上传地址，不保存"></label>
<p id="metadata-scope" class="hint"></p><label class="check"><input id="metadata-consent" type="checkbox">允许向以上平台发送此文件的名称和校验值，取得一次上传地址</label><button id="prepare" class="primary">检查并准备上传</button>
<h2>3 · 核对存储地址并上传</h2><div id="upload" role="status"><p class="hint">准备完成后，这里会显示实际接收文件的存储服务地址。</p></div>
</section><aside><h2>上传记录</h2><p class="hint">成功记录可用于 RHLoraLoader。普通 LoRA 加载节点不适用；请在生成时使用原上传账号或具有相应权限的账号。</p><div id="history"></div></aside></main><div id="toast" role="status"></div><script type="module" src="/loras.js"></script><script type="module" src="/ambient-glass.js"></script></body></html>
