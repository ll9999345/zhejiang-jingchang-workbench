<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>镜场 · Gemini对话</title><script src="/theme-bootstrap.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/cyan-glass.css"><link rel="stylesheet" href="/gemini-cli-chat.css"></head><body><main id="gemini-cli-chat-workbench"><header class="cc-header"><a id="cc-back" href="/">← 镜场画布</a><div><h1>Gemini · 文字与看图</h1><p id="cc-program" role="status">正在读取本机程序状态…</p></div><button id="cc-refresh">读取原记录</button></header><p class="muted">通过本机Gemini程序回答，使用你选择的模型服务。发送前核对上下文与图片；完整回答保存到本机，取回时再修改画布。</p><div class="cc-columns"><section class="cc-glass"><h2>这次讨论</h2><p id="cc-node-context" class="notice" hidden></p><form id="cc-form"><fieldset id="cc-fields"><div class="cc-pair"><label>模型服务<select id="cc-platform" required></select></label><label>对话模型<select id="cc-model" required></select></label></div><p class="muted small">使用 Gemini 原生 API 服务。本入口尚未复用 Google Pro、Jio 或 Flow 网页登录权益。</p><label>沿用本机原回答<select id="cc-previous"><option value="">新讨论，不带入旧内容</option></select></label><label>系统指令<textarea id="cc-system" maxlength="16000" rows="2" placeholder="可留空，例如：用中文给出可直接使用的镜头描述"></textarea></label><label>问题或创作要求<textarea id="cc-text" maxlength="20000" rows="6" required></textarea></label><details><summary>选择本工程参考图片</summary><div id="cc-images"></div></details><label>输出上限<input id="cc-max-tokens" type="number" min="128" max="8192" step="1" value="4096"></label><div class="row"><button class="primary" id="cc-preview" type="submit">本机检查发送范围</button><button id="cc-clear" type="button">清空未提交设置</button></div></fieldset></form><section id="cc-confirm" hidden><h2>确认这一次回答</h2><div id="cc-plan"></div><label>本次API Key<input id="cc-key" type="password" autocomplete="new-password" placeholder="仅本次使用，不保存；本机免认证服务可留空"></label><div class="cc-pair"><label>本次预算<input id="cc-budget" type="number" min="0" step="0.01" value="0"></label><label>预算单位<select id="cc-currency"><option value="CNY">人民币</option><option value="USD">美元</option></select></label></div><label class="cc-consent"><input id="cc-consent" type="checkbox">同意向上述服务发送所列文字、上下文与图片，授权一次请求和本次预算。</label><p class="muted small">预算用于记录授权范围，不代表平台强制扣费上限。不会使用已有CLI登录账户、执行模型命令或改写项目文件。</p><button id="cc-submit" class="primary">确认发送一次</button></section><p id="cc-pending" class="notice" hidden></p></section><section class="cc-glass"><h2>本机原记录</h2><p class="muted small">读取、停止等待和取回均不会重新调用模型。回答不完整或结果不明时先核对原平台记录。</p><div id="cc-records"></div></section></div><p id="cc-status" role="status" aria-live="polite"></p></main><script type="module" src="/gemini-cli-chat.js"></script></body></html>
