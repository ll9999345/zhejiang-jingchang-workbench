<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜场 · 创作对话</title><script src="/theme-bootstrap.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/conversation.css"><link rel="stylesheet" href="/jade-motion.css"><link rel="stylesheet" href="/cyan-glass.css"></head><body data-native-page="conversation">
<header><a id="back" href="/">镜场 / 返回画布</a><strong>创作对话</strong><span id="project-name"></span><a id="creation" href="/creation-studio">图片与视频创作 ↗</a></header>
<main inert><aside><div class="section"><b>项目对话</b><button id="new">＋ 新建</button></div><nav id="conversations"></nav><p class="muted">讨论剧本、修改文案、理解图片、视频抽样、Gemini 原生音频和文字/Word/Excel 文档。支持文字、图片和 Agent 自动创作，结果保存到当前会话。点击「放入画布」后添加节点。</p><label>对话名称<input id="name" maxlength="120"></label><button id="rename">保存名称</button></aside>
<section class="conversation"><div class="connection"><label>模式<select id="mode"><option value="chat">文字对话</option><option value="image">图片创作</option><option value="agent">Agent 自动创作</option></select></label><label id="executor-field" hidden>执行方式<select id="executor" aria-label="文字对话执行方式"><option value="api">原API</option><option value="codex" disabled>本机Codex</option><option value="gemini-cli" disabled>本机Gemini</option></select></label><label>平台<select id="platform"></select></label><label><span id="model-label">对话模型</span><select id="model"></select></label><span class="muted" id="model-note"></span></div><p id="executor-note" class="muted small" hidden></p><button id="recover-codex" type="button" hidden>读取Codex原记录</button><details id="conversation-settings" name="conversation-options"><summary>对话设置 · 系统指令</summary><label>回答与创作风格<textarea id="system-prompt" rows="3" maxlength="16000" placeholder="例如：用中文回答，优先给出可直接使用的镜头描述"></textarea></label><p class="muted">用于文字对话和 Agent 的内容/风格指导。不会扩展工具、发送范围或调用次数。</p><button id="save-system" type="button">保存对话设置</button></details><div id="messages" aria-live="polite"></div><div id="job" role="status"></div><form id="composer"><details class="agent-options" name="conversation-options" hidden><summary>Agent 图片服务与创作设置</summary><div class="agent-fields"><label>图片平台<select id="agent-image-platform"></select></label><label>图片模型<select id="agent-image-model"></select></label><label>生成数量<select id="agent-count"><option value="auto">从描述判断（1–4张）</option><option value="1">1 张</option><option value="2">2 张</option><option value="3">3 张</option><option value="4">4 张</option></select></label><label>尺寸<input id="agent-size" value="auto" placeholder="auto 或 1024x1024"></label><label>质量<select id="agent-quality"><option value="auto">自动</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label></div><label class="inherit-image"><input id="inherit-image" type="checkbox" checked>改图时可沿用最近一次完整生成的首张图片</label><p class="muted">先判断是问答、生图还是改图。普通问答再调用一次对话模型；生图最多4张，改图1张。发送前分别确认服务和预算。</p></details><div id="attachments"></div><textarea id="text" rows="4" maxlength="20000" placeholder="写下你的问题，或选择参考图片、视频、音频或文档后提问…" required aria-label="消息"></textarea><div class="image-options" hidden><label>比例<select id="image-ratio"><option value="custom">自动 / 自定义</option><option value="1:1">1:1</option><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="4:3">4:3</option><option value="3:4">3:4</option></select></label><label>分辨率<select id="image-resolution"><option value="1024">1K</option><option value="2048">2K</option><option value="4096">4K</option></select></label><label>尺寸<input id="image-size" value="auto" maxlength="256" placeholder="auto 或 1024x1024"></label><label>质量<select id="image-quality"><option value="auto">自动</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label><label id="gemini-history-option" hidden><input id="gemini-history" type="checkbox">发送此前同模型的 Gemini 图片创作轮次</label><p id="gemini-history-note" class="muted small"></p></div><div id="video-input-options" class="video-options"><label>新视频发送方式<select id="video-input-mode" aria-label="新视频发送方式"><option value="frames">抽样画面（不含声音）</option><option value="native" disabled>原视频（含其中声音，仅 Gemini）</option></select></label><p id="video-input-note" class="muted"></p></div><div class="stream-options"><label><input id="stream" type="checkbox" checked>逐步显示回答</label><label>输出上限<input id="max-tokens" type="number" min="128" max="8192" step="1" value="4096" aria-label="输出上限"></label></div><div class="compose-actions"><button type="button" id="pick">＋ 项目图片</button><button type="button" id="upload">上传图片</button><input type="file" id="upload-files" accept="image/png,image/jpeg,image/webp" multiple hidden><span class="muted" id="scope-note">发送最近20条消息及其中的图片、视频抽样和文档内容；音频仅限已确认支持的 Gemini 对话模型</span><button class="primary" id="send">检查并发送</button></div></form></section></main>
<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div id="dialog-actions"></div></dialog><div id="toast" role="status"></div><script type="module" src="/conversation.js"></script><script type="module" src="/ambient-glass.js"></script></body></html>
